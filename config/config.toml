[llm]
api_type = "openai"
model = "z-ai/glm-4.7"
base_url = "https://openrouter.ai/api/v1"
api_key = "<REPLACE_WITH_YOUR_KEY>"
# Note: OpenRouter keys are typically "sk-or-v1-...". Use the correct key for this provider.
max_tokens = 4000
temperature = 0.0

# Primary (fast, but rate-limited)
[llm.primary]
model = "llama-3.3-70b-versatile"  # chat model; whisper is not chat
base_url = "https://api.groq.com/openai/v1"
api_key = "<REPLACE_WITH_YOUR_KEY>"
max_tokens = 4000
temperature = 0.0
# Backup (slower, but unlimited)
[llm.backup]
model = "openai/gpt-oss-120b"
base_url = "https://api.groq.com/openai/v1"
api_key = "<REPLACE_WITH_YOUR_KEY>"
max_tokens = 4000
temperature = 0.0
# Optional second backup
[llm.backup2]
model = "moonshotai/kimi-k2-instruct"
base_url = "https://api.groq.com/openai/v1"
api_key = "<REPLACE_WITH_YOUR_KEY>"
max_tokens = 4000
temperature = 0.0

# Optional second backup
[llm.backup3]
model = "llama-3.3-70b-versatile"
base_url = "https://api.groq.com/openai/v1"
api_key = "<REPLACE_WITH_YOUR_KEY>"
max_tokens = 4000
temperature = 0.0

[llm.backup4]
api_type = "openai"
model = "xiaomi/mimo-v2-flash:free"
